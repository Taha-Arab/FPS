<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Aim Calibration Room</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1e; font-family: -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; cursor: crosshair; }

  #hint {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #b8b8c0;
    font-size: 12px;
    background: rgba(20, 20, 24, 0.7);
    padding: 8px 10px;
    border-radius: 6px;
    z-index: 10;
    pointer-events: none;
  }

  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 5;
  }
  #crosshair .ch-line { position: absolute; background: #39ff6a; }
  #crosshair .ch-h { width: 18px; height: 2px; top: -1px; left: -9px; }
  #crosshair .ch-v { width: 2px; height: 18px; top: -9px; left: -1px; }
  #crosshair .ch-dot {
    position: absolute; width: 3px; height: 3px; top: -1.5px; left: -1.5px;
    background: #39ff6a; border-radius: 50%;
  }

  #panel {
    position: fixed;
    top: 12px;
    right: 12px;
    bottom: 12px;
    width: 320px;
    background: rgba(20, 20, 24, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 14px;
    color: #e6e6e6;
    font-size: 12px;
    z-index: 10;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    overflow-y: auto;
  }
  #panel h1 { font-size: 13px; margin: 0 0 10px; color: #fff; letter-spacing: 0.02em; }
  #panel h2 {
    font-size: 11px;
    margin: 16px 0 8px;
    color: #39ff6a;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 4px;
  }
  #panel .row { display: flex; gap: 8px; margin-bottom: 8px; }
  #panel button {
    flex: 1;
    background: #2b2b33;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e6e6e6;
    padding: 7px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
  }
  #panel button:hover { background: #37373f; }
  #panel button.active { background: #39ff6a; color: #0a0a0a; border-color: #39ff6a; font-weight: 600; }

  .slider-block { margin-bottom: 9px; }
  .slider-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
    color: #b8b8c0;
  }
  .slider-label span.val { color: #39ff6a; font-family: "SF Mono", Consolas, monospace; }
  input[type="range"] { width: 100%; }

  hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.12); margin: 12px 0; }

  /* Mirrors #damage-numbers / .damage-number in src/style.css exactly. */
  #damage-numbers { position: fixed; inset: 0; overflow: hidden; pointer-events: none; user-select: none; z-index: 6; }
  .damage-number {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 1.05rem;
    font-weight: 800;
    color: #ffd977;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.7);
    animation: damage-number-pop 0.8s ease-out forwards;
  }
  .damage-number.headshot { color: #ff5b45; font-size: 1.3rem; }
  @keyframes damage-number-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    12% { opacity: 1; transform: translate(-50%, -58%) scale(1.35); }
    30% { transform: translate(-50%, -80%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -190%) scale(0.9); }
  }

  #output {
    background: #0c0c0f;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    padding: 8px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 10px;
    line-height: 1.5;
    white-space: pre;
    color: #9be89b;
    overflow-x: auto;
    user-select: all;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div id="hint">
  Click the scene to look around (Esc to release)<br />
  Hold Right-Click or use the ADS button to aim<br />
  Left-click to fire at the dummies
</div>

<div id="damage-numbers"></div>

<div id="crosshair">
  <div class="ch-line ch-h"></div>
  <div class="ch-line ch-v"></div>
  <div class="ch-dot"></div>
</div>

<div id="panel">
  <h1>Aim Calibration</h1>

  <div class="row">
    <button id="btn-ads">ADS: Off</button>
  </div>

  <h2>Hip Position</h2>
  <div id="group-hip-pos"></div>
  <h2>Hip Rotation</h2>
  <div id="group-hip-rot"></div>
  <h2>ADS Position</h2>
  <div id="group-ads-pos"></div>
  <h2>ADS Rotation</h2>
  <div id="group-ads-rot"></div>

  <hr />
  <div class="row">
    <button id="btn-copy">Copy Code</button>
  </div>
  <div id="output"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/examples/jsm/loaders/DRACOLoader.js";
import { clone as cloneSkeleton } from "three/examples/jsm/utils/SkeletonUtils.js";

// ---------------------------------------------------------------------------
// Aim calibration room (feat/player-arms) — NOT part of the Vite build
// (three.js loaded from a CDN via importmap). Live-tunes HIP_POSITION/
// HIP_ROTATION/ADS_POSITION/ADS_ROTATION for src/playerArms.js against two
// stationary SWAT dummies, without a full match restart per change.
// Read src/playerArms.js by hand to seed the starting values below whenever
// those constants change — this file has no build-time link to that one.
// ---------------------------------------------------------------------------

const SWAT_MESH_URL = "/assets/bots/swat_mesh.glb";
const PLAYER_ARMS_URL = "/assets/player/player_arms.glb";
const DRACO_DECODER_PATH = "/vendor/draco/";

// Matches src/playerArms.js's own VIEWMODEL_SCALE — not exposed as a
// slider here since that was already calibrated in the previous sandbox
// pass; this room is only for HIP_*/ADS_* position + rotation.
const VIEWMODEL_SCALE = 0.01;

// Hardcoded, measured-once offset from the fully-assembled wrapper's own
// origin (post-scale, post camera-bone-alignment, post 180° yaw) to the
// gun's actual bounding-box center — i.e. "how far off is the rig's local
// origin from the shoulder, from where the gun visually sits." Rotating
// HIP_ROTATION/ADS_ROTATION previously swung the barrel through a huge arc
// because that origin sat at the shoulder while the barrel was ~0.13-0.17
// units away in local space; shifting wrapper's position by -this makes
// the gun's own center coincide with the pivot the sliders rotate around.
// Measured via Box3().setFromObject(wrapper) right after construction,
// while wrapper was still unparented — re-measure and update this constant
// if player_arms.glb, VIEWMODEL_SCALE, or the alignment logic below ever
// changes. MUST be mirrored exactly into src/playerArms.js (see there).
const GUN_CENTER_OFFSET = new THREE.Vector3(0, 0.169, -0.127);

const EYE_HEIGHT = 1.8; // matches main.js: PLAYER_HALF_HEIGHT + PLAYER_RADIUS + EYE_HEIGHT

// Seeded from src/playerArms.js's HIP_POSITION/ADS_POSITION, COMPENSATED
// by +GUN_CENTER_OFFSET. Those constants were calibrated back when
// wrapper sat at root's origin (position (0,0,0)) — i.e. root.position
// WAS the gun's world offset directly. Now that wrapper.position is
// permanently offset by -GUN_CENTER_OFFSET (see above), the gun's world
// offset is root.position + wrapper.position, so root.position has to be
// the OLD calibrated value PLUS GUN_CENTER_OFFSET to land the gun in the
// same visible spot as before — without this, the old values put the gun
// behind the camera (verified: armsScene ended up at local Z > 0).
const state = {
  hipPos: { x: 0.05, y: -0.201, z: -0.132 },
  hipRot: { x: 0, y: 0, z: 0 }, // radians
  adsPos: { x: -0.025, y: -0.1735, z: -0.137 },
  adsRot: { x: 0, y: 0, z: 0 }, // radians
};
let adsToggle = false;
let adsRightMouseHeld = false;
function isAds() {
  return adsToggle || adsRightMouseHeld;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1e);
scene.add(new THREE.GridHelper(80, 80, 0x555566, 0x333340));
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(4, 8, 5);
scene.add(sun);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Matches src/main.js's PerspectiveCamera exactly (fov/near/far) so
// perspective distortion in this room matches the real game.
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.001,
  1000
);
camera.rotation.order = "YXZ";
camera.position.set(0, EYE_HEIGHT, 0);

// --- Pointer-lock mouselook (mirrors main.js's YXZ FPS look) --------------
let yaw = 0;
let pitch = 0;
const MOUSE_SENSITIVITY = 0.0022;

renderer.domElement.addEventListener("click", () => {
  renderer.domElement.requestPointerLock();
});
renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
renderer.domElement.addEventListener("mousedown", (e) => {
  if (e.button === 2) {
    adsRightMouseHeld = true;
    applyPose();
  } else if (e.button === 0) {
    if (document.pointerLockElement === renderer.domElement) fireShot();
  }
});
window.addEventListener("mouseup", (e) => {
  if (e.button === 2) {
    adsRightMouseHeld = false;
    applyPose();
  }
});
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * MOUSE_SENSITIVITY;
  pitch -= e.movementY * MOUSE_SENSITIVITY;
  pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

// --- Loaders ---------------------------------------------------------------
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath(DRACO_DECODER_PATH);
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

// Two stationary target dummies at 10m/30m, offset on X so they're not
// staring straight through each other down the same line — no
// AnimationMixer is ever created for either, so they stay frozen in the
// file's bind pose (no AI, no movement, nothing to strip beyond just never
// animating them). Loaded once and SkeletonUtils-cloned for the second
// copy so the ~116MB GLB isn't fetched twice.
// GUN_DAMAGE/HEADSHOT_* mirror the real constants in src/main.js and
// src/botmodel.js so damage numbers here mean the same thing they would
// in an actual match.
const GUN_DAMAGE = 25;
const HEADSHOT_MULTIPLIER = 2;
const DUMMY_HEALTH_MAX = 100;
// main.js's headshot check is hitPoint.y > bot.body.translation().y +
// HEADSHOT_MIN_Y_OFFSET(0.52), where body.translation() is the physics
// capsule's CENTER (ground + PLAYER_HALF_HEIGHT + PLAYER_RADIUS = 1.0m).
// These dummies have no physics body, so approximate that same center as
// dummy.position.y + 1.0 (dummy roots sit at ground/feet level).
const HEADSHOT_MIN_Y = 1.0 + 0.52;

const targets = []; // { root, health } for every dummy, used by the raycast below

function makeDummy(gltfScene, x, z) {
  gltfScene.position.set(x, 0, z);
  scene.add(gltfScene);
  const dummy = { root: gltfScene, health: DUMMY_HEALTH_MAX };
  gltfScene.traverse((obj) => {
    if (obj.isMesh || obj.isSkinnedMesh) obj.userData.dummy = dummy;
  });
  targets.push(dummy);
}

gltfLoader.load(SWAT_MESH_URL, (gltf) => {
  // Clone BEFORE either copy gets a userData.dummy tag — dummy.root
  // circularly references the scene object itself, and SkeletonUtils.clone()
  // copies userData via JSON.stringify() internally, which throws on a
  // circular structure if the tag is already present at clone time.
  const clonedScene = cloneSkeleton(gltf.scene);
  makeDummy(gltf.scene, -3, -10);
  makeDummy(clonedScene, 3, -30);
});

// --- Shooting: raycast + floating damage numbers, mirroring fireShot()/
// spawnDamageNumber() in src/main.js — a THREE.Raycaster against the
// dummies' meshes stands in for the real game's Rapier physics castRay
// (no physics world exists in this sandbox), everything else (headshot
// rule, damage math, DOM popup + CSS animation) is the same technique. ---
const damageNumbersEl = document.getElementById("damage-numbers");
const DAMAGE_NUMBER_LIFETIME_MS = 850;

function spawnDamageNumber(worldPoint, amount, isHeadshot) {
  const projected = new THREE.Vector3(
    worldPoint.x,
    worldPoint.y,
    worldPoint.z
  ).project(camera);
  if (projected.z > 1) return; // behind the camera

  const el = document.createElement("span");
  el.className = isHeadshot ? "damage-number headshot" : "damage-number";
  el.textContent = String(Math.round(amount));
  const jitterX = (Math.random() - 0.5) * 28;
  el.style.left = `${((projected.x + 1) / 2) * window.innerWidth + jitterX}px`;
  el.style.top = `${((1 - projected.y) / 2) * window.innerHeight}px`;
  damageNumbersEl.appendChild(el);
  setTimeout(() => el.remove(), DAMAGE_NUMBER_LIFETIME_MS);
}

const raycaster = new THREE.Raycaster();
raycaster.far = 100; // matches GUN_RANGE in main.js

function fireShot() {
  if (shootAction) {
    shootAction.reset().play();
    if (idleAction) shootAction.crossFadeFrom(idleAction, 0.08, false);
  }

  raycaster.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));
  const hits = raycaster.intersectObjects(
    targets.map((t) => t.root),
    true
  );
  if (hits.length === 0) return;

  const dummy = hits[0].object.userData.dummy;
  if (!dummy) return;

  const isHeadshot = hits[0].point.y > dummy.root.position.y + HEADSHOT_MIN_Y;
  const damage = isHeadshot ? GUN_DAMAGE * HEADSHOT_MULTIPLIER : GUN_DAMAGE;

  // Never actually dies/despawns: once depleted it just resets to full, so
  // it's a repeatable target instead of a one-shot kill.
  dummy.health -= damage;
  if (dummy.health <= 0) dummy.health = DUMMY_HEALTH_MAX;

  spawnDamageNumber(hits[0].point, damage, isHeadshot);
}

// Player arms, attached directly to the camera exactly like
// createPlayerArms() in src/playerArms.js.
const root = new THREE.Group();
camera.add(root);
scene.add(camera);

let armsMixer = null;
let idleAction = null;
let shootAction = null;
const clock = new THREE.Clock();

gltfLoader.load(PLAYER_ARMS_URL, (gltf) => {
  const armsScene = gltf.scene;
  armsScene.scale.setScalar(VIEWMODEL_SCALE);

  if (gltf.animations && gltf.animations.length > 0) {
    armsMixer = new THREE.AnimationMixer(armsScene);
    const idleClip = gltf.animations.find((c) => /idle/i.test(c.name));
    if (idleClip) {
      idleAction = armsMixer.clipAction(idleClip);
      idleAction.play();
    }
    const shootClip = gltf.animations.find((c) => /shoot/i.test(c.name));
    if (shootClip) {
      shootAction = armsMixer.clipAction(shootClip);
      shootAction.setLoop(THREE.LoopOnce, 1);
      shootAction.clampWhenFinished = false;
      armsMixer.addEventListener("finished", (event) => {
        if (event.action === shootAction && idleAction) {
          idleAction.reset().play();
          idleAction.crossFadeFrom(shootAction, 0.15, false);
        }
      });
    }
  }

  // Same camera-bone alignment as src/playerArms.js: if the rig has a
  // camera_01 bone, center it at this group's local origin and correct
  // for the rig's reversed forward convention.
  armsScene.updateMatrixWorld(true);
  const cameraBone = armsScene.getObjectByName("camera_01");
  if (cameraBone) {
    const camBoneWorld = cameraBone.getWorldPosition(new THREE.Vector3());
    armsScene.position.sub(camBoneWorld);
  } else {
    console.error(
      "sandbox: no camera_01 bone found on player_arms.glb — skipping the " +
        "auto camera-alignment offset, matching src/playerArms.js's fallback"
    );
  }
  const wrapper = new THREE.Group();
  wrapper.add(armsScene);
  wrapper.rotation.y = Math.PI;
  // Re-centers the (already rotated) gun so its visual center — not the
  // shoulder — sits at root's origin, i.e. at the pivot HIP_ROTATION/
  // ADS_ROTATION actually rotate around. See GUN_CENTER_OFFSET above.
  wrapper.position.sub(GUN_CENTER_OFFSET);
  root.add(wrapper);

  const CROSSHAIR_NAME_PATTERN = /crosshair|reticle/i;
  armsScene.traverse((obj) => {
    if (obj.isMesh || obj.isSkinnedMesh) {
      obj.frustumCulled = false;
      if (CROSSHAIR_NAME_PATTERN.test(obj.name)) obj.visible = false;
    }
  });

  applyPose();
});

// --- Pose application -------------------------------------------------------
const crosshairEl = document.getElementById("crosshair");
const eulerScratch = new THREE.Euler();

function applyPose() {
  const pos = isAds() ? state.adsPos : state.hipPos;
  const rot = isAds() ? state.adsRot : state.hipRot;
  root.position.set(pos.x, pos.y, pos.z);
  eulerScratch.set(rot.x, rot.y, rot.z);
  root.quaternion.setFromEuler(eulerScratch);
  crosshairEl.style.display = isAds() ? "none" : "block";
  refreshOutput();
}

// --- Slider panel (generated to avoid 12x near-identical markup blocks) ---
const SLIDER_GROUPS = [
  { containerId: "group-hip-pos", store: state.hipPos, isRotation: false },
  { containerId: "group-hip-rot", store: state.hipRot, isRotation: true },
  { containerId: "group-ads-pos", store: state.adsPos, isRotation: false },
  { containerId: "group-ads-rot", store: state.adsRot, isRotation: true },
];

for (const group of SLIDER_GROUPS) {
  const container = document.getElementById(group.containerId);
  for (const axis of ["x", "y", "z"]) {
    const block = document.createElement("div");
    block.className = "slider-block";

    const label = document.createElement("div");
    label.className = "slider-label";
    const valSpan = document.createElement("span");
    valSpan.className = "val";
    label.innerHTML = `<span>${axis.toUpperCase()}</span>`;
    label.appendChild(valSpan);

    const input = document.createElement("input");
    input.type = "range";
    if (group.isRotation) {
      // Dragged in degrees for intuition; stored/output in radians.
      input.min = "-180";
      input.max = "180";
      input.step = "0.1";
      input.value = THREE.MathUtils.radToDeg(group.store[axis]);
    } else {
      input.min = "-2";
      input.max = "2";
      input.step = "0.001";
      input.value = group.store[axis];
    }

    function updateLabel() {
      if (group.isRotation) {
        const deg = parseFloat(input.value);
        valSpan.textContent = `${deg.toFixed(1)}° (${THREE.MathUtils.degToRad(deg).toFixed(4)} rad)`;
      } else {
        valSpan.textContent = parseFloat(input.value).toFixed(3);
      }
    }
    updateLabel();

    input.addEventListener("input", () => {
      group.store[axis] = group.isRotation
        ? THREE.MathUtils.degToRad(parseFloat(input.value))
        : parseFloat(input.value);
      updateLabel();
      applyPose();
    });

    block.appendChild(label);
    block.appendChild(input);
    container.appendChild(block);
  }
}

// --- ADS toggle button + output/copy ---------------------------------------
const btnAds = document.getElementById("btn-ads");
btnAds.addEventListener("click", () => {
  adsToggle = !adsToggle;
  btnAds.textContent = `ADS: ${adsToggle ? "On" : "Off"}`;
  btnAds.classList.toggle("active", adsToggle);
  applyPose();
});

const outputEl = document.getElementById("output");
function refreshOutput() {
  const p = (v) => v.toFixed(4);
  outputEl.textContent =
    `const HIP_POSITION = new THREE.Vector3(${p(state.hipPos.x)}, ${p(state.hipPos.y)}, ${p(state.hipPos.z)});\n` +
    `const HIP_ROTATION = new THREE.Euler(${p(state.hipRot.x)}, ${p(state.hipRot.y)}, ${p(state.hipRot.z)});\n` +
    `const ADS_POSITION = new THREE.Vector3(${p(state.adsPos.x)}, ${p(state.adsPos.y)}, ${p(state.adsPos.z)});\n` +
    `const ADS_ROTATION = new THREE.Euler(${p(state.adsRot.x)}, ${p(state.adsRot.y)}, ${p(state.adsRot.z)});`;
}
refreshOutput();

const btnCopy = document.getElementById("btn-copy");
btnCopy.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(outputEl.textContent);
    btnCopy.textContent = "Copied!";
  } catch {
    // Clipboard API can be blocked (permissions/insecure context); the
    // output block has user-select: all as a manual fallback.
    btnCopy.textContent = "Select text below";
  }
  setTimeout(() => (btnCopy.textContent = "Copy Code"), 1200);
});

// --- Resize + render loop ---------------------------------------------------
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (armsMixer) armsMixer.update(dt);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
