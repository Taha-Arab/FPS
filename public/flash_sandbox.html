<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Muzzle Flash Calibration</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1e; font-family: -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; cursor: crosshair; }

  #hint {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #b8b8c0;
    font-size: 12px;
    background: rgba(20, 20, 24, 0.7);
    padding: 8px 10px;
    border-radius: 6px;
    z-index: 10;
    pointer-events: none;
  }

  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 5;
  }
  #crosshair .ch-line { position: absolute; background: #39ff6a; }
  #crosshair .ch-h { width: 18px; height: 2px; top: -1px; left: -9px; }
  #crosshair .ch-v { width: 2px; height: 18px; top: -9px; left: -1px; }
  #crosshair .ch-dot {
    position: absolute; width: 3px; height: 3px; top: -1.5px; left: -1.5px;
    background: #39ff6a; border-radius: 50%;
  }

  #panel {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 300px;
    background: rgba(20, 20, 24, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 14px;
    color: #e6e6e6;
    font-size: 12px;
    z-index: 10;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  }
  #panel h1 { font-size: 13px; margin: 0 0 10px; color: #fff; letter-spacing: 0.02em; }

  .slider-block { margin-bottom: 9px; }
  .slider-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
    color: #b8b8c0;
  }
  .slider-label span.val { color: #ffd977; font-family: "SF Mono", Consolas, monospace; }
  input[type="range"] { width: 100%; }

  hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.12); margin: 12px 0; }

  /* Mirrors #damage-numbers / .damage-number in src/style.css exactly. */
  #damage-numbers { position: fixed; inset: 0; overflow: hidden; pointer-events: none; user-select: none; z-index: 6; }
  .damage-number {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 1.05rem;
    font-weight: 800;
    color: #ffd977;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.7);
    animation: damage-number-pop 0.8s ease-out forwards;
  }
  .damage-number.headshot { color: #ff5b45; font-size: 1.3rem; }
  @keyframes damage-number-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    12% { opacity: 1; transform: translate(-50%, -58%) scale(1.35); }
    30% { transform: translate(-50%, -80%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -190%) scale(0.9); }
  }

  #output {
    background: #0c0c0f;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    padding: 8px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre;
    color: #9be89b;
    overflow-x: auto;
    user-select: all;
  }
</style>
</head>
<body>

<div id="hint">
  Click the scene to look around (Esc to release)<br />
  Left-click to fire at the dummies
</div>

<div id="damage-numbers"></div>

<div id="crosshair">
  <div class="ch-line ch-h"></div>
  <div class="ch-line ch-v"></div>
  <div class="ch-dot"></div>
</div>

<div id="panel">
  <h1>Muzzle Flash Calibration</h1>

  <div class="slider-block">
    <div class="slider-label"><span>X</span><span class="val" id="val-x"></span></div>
    <input type="range" id="slider-x" min="-0.5" max="0.5" step="0.001" />
  </div>
  <div class="slider-block">
    <div class="slider-label"><span>Y</span><span class="val" id="val-y"></span></div>
    <input type="range" id="slider-y" min="-0.5" max="0.5" step="0.001" />
  </div>
  <div class="slider-block">
    <div class="slider-label"><span>Z</span><span class="val" id="val-z"></span></div>
    <input type="range" id="slider-z" min="-0.5" max="0.5" step="0.001" />
  </div>

  <hr />
  <div id="output"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/examples/jsm/loaders/DRACOLoader.js";
import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
import { clone as cloneSkeleton } from "three/examples/jsm/utils/SkeletonUtils.js";

// ---------------------------------------------------------------------------
// Muzzle flash calibration sandbox (feat/player-arms) — NOT part of the
// Vite build (three.js loaded from a CDN via importmap). Live-tunes
// MUZZLE_FLASH_OFFSET for src/playerArms.js: loads player_arms.glb exactly
// like the real game (same scale/pivot/alignment logic), attaches a real
// sprite+PointLight muzzle flash to muzzleTip, and lets X/Y/Z sliders walk
// MUZZLE_FLASH_OFFSET out to the barrel tip. Two stationary SWAT dummies
// stand in as live-fire targets so the flash can be judged mid-shot instead
// of only in a frozen, permanently-lit state.
// ---------------------------------------------------------------------------

const PLAYER_ARMS_URL = "/assets/player/player_arms.glb";
const SWAT_MESH_URL = "/assets/bots/swat_mesh.glb";
const MUZZLE_FLASH_TEXTURE_URL = "/assets/muzzle_flash.png";
const DRACO_DECODER_PATH = "/vendor/draco/";

// Mirrors src/playerArms.js's own constants exactly — this sandbox has no
// build-time link to that file, so re-read it by hand if these ever change.
const VIEWMODEL_SCALE = 0.01;
const GUN_CENTER_OFFSET = new THREE.Vector3(0, 0.169, -0.127);
const HIP_POSITION = new THREE.Vector3(0.05, -0.201, -0.132);
const MUZZLE_TIP_OFFSET = new THREE.Vector3(0.05, -0.05, -0.6);

const EYE_HEIGHT = 1.8; // matches main.js: PLAYER_HALF_HEIGHT + PLAYER_RADIUS + EYE_HEIGHT

// Muzzle flash tuning.
const MUZZLE_FLASH_SPRITE_SIZE = 0.2; // world units, square
const MUZZLE_FLASH_VISIBLE_MS = 60; // how long the sprite itself stays visible
const MUZZLE_FLASH_LIGHT_MAX_INTENSITY = 14;
// Exponential decay rate for the PointLight: 1-exp(-rate*dt) per frame.
// rate=60 reaches ~1% of max intensity by ~0.077s, landing in the
// requested 0.05-0.1s window without a hard cutoff.
const MUZZLE_FLASH_LIGHT_DECAY_RATE = 60;

// Seeded from the current MUZZLE_FLASH_OFFSET in src/playerArms.js.
const state = { x: -0.025, y: 0.18, z: 0.408 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1e);
scene.add(new THREE.GridHelper(80, 80, 0x555566, 0x333340));

// Matches src/environment.js's proven-working light setup exactly (the
// real game renders this same GLB fine with these). Every material on
// this model is fully metallic (metalness=1) — a metal surface's
// appearance comes almost entirely from specular/environment reflection,
// not diffuse light, so dim direct lights with no environment map leave it
// rendering essentially black against the dark background. A
// RoomEnvironment is added below too — the textbook-correct way to give
// metalness=1 PBR materials something to reflect without needing a real
// HDR asset.
scene.add(new THREE.HemisphereLight(0xbdd4e7, 0x8a8072, 1.5));
const sun = new THREE.DirectionalLight(0xfff1dd, 3.2);
sun.position.set(4, 8, 5);
scene.add(sun);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

// Matches src/main.js's PerspectiveCamera exactly (fov/near/far).
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.001,
  1000
);
camera.rotation.order = "YXZ";
camera.position.set(0, EYE_HEIGHT, 0);
scene.add(camera);

// --- Pointer-lock mouselook (mirrors main.js's YXZ FPS look) --------------
let yaw = 0;
let pitch = 0;
const MOUSE_SENSITIVITY = 0.0022;

renderer.domElement.addEventListener("click", () => {
  renderer.domElement.requestPointerLock();
});
renderer.domElement.addEventListener("mousedown", (e) => {
  if (e.button === 0 && document.pointerLockElement === renderer.domElement) {
    fireShot();
  }
});
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * MOUSE_SENSITIVITY;
  pitch -= e.movementY * MOUSE_SENSITIVITY;
  pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

// --- Loaders ---------------------------------------------------------------
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath(DRACO_DECODER_PATH);
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

// --- Target dummies: two stationary SWAT bots, offset on X so they're not
// staring straight through each other, at 10m/30m. No AnimationMixer is
// ever created for either, so they stay frozen in bind pose (no AI, no
// movement). Loaded once and SkeletonUtils-cloned for the second copy so
// the ~116MB GLB isn't fetched twice. ---------------------------------------
const GUN_DAMAGE = 25;
const HEADSHOT_MULTIPLIER = 2;
const DUMMY_HEALTH_MAX = 100;
// main.js's headshot check is hitPoint.y > bot.body.translation().y +
// HEADSHOT_MIN_Y_OFFSET(0.52), where body.translation() is the physics
// capsule's CENTER (ground + PLAYER_HALF_HEIGHT + PLAYER_RADIUS = 1.0m).
// These dummies have no physics body, so approximate that same center as
// dummy.position.y + 1.0.
const HEADSHOT_MIN_Y = 1.0 + 0.52;

const targets = []; // { root, health } for every dummy, used by the raycast below

function makeDummy(gltfScene, x, z) {
  gltfScene.position.set(x, 0, z);
  scene.add(gltfScene);
  const dummy = { root: gltfScene, health: DUMMY_HEALTH_MAX };
  gltfScene.traverse((obj) => {
    if (obj.isMesh || obj.isSkinnedMesh) obj.userData.dummy = dummy;
  });
  targets.push(dummy);
}

gltfLoader.load(SWAT_MESH_URL, (gltf) => {
  // Clone BEFORE either copy gets a userData.dummy tag — dummy.root
  // circularly references the scene object itself, and SkeletonUtils.clone()
  // copies userData via JSON.stringify() internally, which throws on a
  // circular structure if the tag is already present at clone time.
  const clonedScene = cloneSkeleton(gltf.scene);
  makeDummy(gltf.scene, -3, -10);
  makeDummy(clonedScene, 3, -30);
});

// --- Damage numbers, mirroring spawnDamageNumber() in src/main.js ---------
const damageNumbersEl = document.getElementById("damage-numbers");
const DAMAGE_NUMBER_LIFETIME_MS = 850;

function spawnDamageNumber(worldPoint, amount, isHeadshot) {
  const projected = new THREE.Vector3(
    worldPoint.x,
    worldPoint.y,
    worldPoint.z
  ).project(camera);
  if (projected.z > 1) return; // behind the camera

  const el = document.createElement("span");
  el.className = isHeadshot ? "damage-number headshot" : "damage-number";
  el.textContent = String(Math.round(amount));
  const jitterX = (Math.random() - 0.5) * 28;
  el.style.left = `${((projected.x + 1) / 2) * window.innerWidth + jitterX}px`;
  el.style.top = `${((1 - projected.y) / 2) * window.innerHeight}px`;
  damageNumbersEl.appendChild(el);
  setTimeout(() => el.remove(), DAMAGE_NUMBER_LIFETIME_MS);
}

// --- Player arms, attached directly to the camera exactly like
// createPlayerArms() in src/playerArms.js. ----------------------------------
const root = new THREE.Group();
camera.add(root);
root.position.copy(HIP_POSITION);

const muzzleTip = new THREE.Object3D();
muzzleTip.position.copy(MUZZLE_TIP_OFFSET);
root.add(muzzleTip);

// Muzzle flash: a 2D additive sprite (real texture, not a flat-color plane
// cross) plus the PointLight, both parented under flashAnchor so the X/Y/Z
// sliders below can walk MUZZLE_FLASH_OFFSET out to the barrel tip.
const flashAnchor = new THREE.Object3D();
flashAnchor.position.set(state.x, state.y, state.z);
muzzleTip.add(flashAnchor);

const textureLoader = new THREE.TextureLoader();
const flashTexture = textureLoader.load(MUZZLE_FLASH_TEXTURE_URL);
const flashSpriteMat = new THREE.SpriteMaterial({
  map: flashTexture,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
});
const flashSprite = new THREE.Sprite(flashSpriteMat);
flashSprite.scale.setScalar(MUZZLE_FLASH_SPRITE_SIZE);
flashSprite.visible = false;
flashAnchor.add(flashSprite);

const flashLight = new THREE.PointLight(0xffc36b, 0, 6, 2);
flashAnchor.add(flashLight);

let flashHideAt = 0;

// --- Shooting: raycast + floating damage numbers + muzzle flash, mirroring
// fireShot()/spawnDamageNumber() in src/main.js and fire() in
// src/playerArms.js. A THREE.Raycaster against the dummies' meshes stands
// in for the real game's Rapier physics castRay (no physics world exists
// in this sandbox). ---------------------------------------------------------
const raycaster = new THREE.Raycaster();
raycaster.far = 100; // matches GUN_RANGE in main.js

let armsMixer = null;
let idleAction = null;
let shootAction = null;
const clock = new THREE.Clock();

function fireShot() {
  // Muzzle flash: random Z rotation each shot so consecutive flashes don't
  // look identical, sprite shown for a short fixed window, light popped to
  // max and left to decay smoothly in the render loop below.
  flashSpriteMat.rotation = Math.random() * Math.PI * 2;
  flashSprite.visible = true;
  flashHideAt = performance.now() + MUZZLE_FLASH_VISIBLE_MS;
  flashLight.intensity = MUZZLE_FLASH_LIGHT_MAX_INTENSITY;

  if (shootAction) {
    shootAction.reset().play();
    if (idleAction) shootAction.crossFadeFrom(idleAction, 0.08, false);
  }

  raycaster.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));
  const hits = raycaster.intersectObjects(
    targets.map((t) => t.root),
    true
  );
  if (hits.length === 0) return;

  const dummy = hits[0].object.userData.dummy;
  if (!dummy) return;

  const isHeadshot = hits[0].point.y > dummy.root.position.y + HEADSHOT_MIN_Y;
  const damage = isHeadshot ? GUN_DAMAGE * HEADSHOT_MULTIPLIER : GUN_DAMAGE;

  // Never actually dies/despawns: once depleted it just resets to full, so
  // it's a repeatable target instead of a one-shot kill.
  dummy.health -= damage;
  if (dummy.health <= 0) dummy.health = DUMMY_HEALTH_MAX;

  spawnDamageNumber(hits[0].point, damage, isHeadshot);
}

gltfLoader.load(PLAYER_ARMS_URL, (gltf) => {
  const armsScene = gltf.scene;
  armsScene.scale.setScalar(VIEWMODEL_SCALE);

  if (gltf.animations && gltf.animations.length > 0) {
    armsMixer = new THREE.AnimationMixer(armsScene);
    const idleClip = gltf.animations.find((c) => /idle/i.test(c.name));
    if (idleClip) {
      idleAction = armsMixer.clipAction(idleClip);
      idleAction.play();
    }
    const shootClip = gltf.animations.find((c) => /shoot/i.test(c.name));
    if (shootClip) {
      shootAction = armsMixer.clipAction(shootClip);
      shootAction.setLoop(THREE.LoopOnce, 1);
      // true, not false: a LoopOnce action with clampWhenFinished=false
      // goes fully disabled the instant it finishes (verified against
      // three.js's own source in a prior fix), which makes the very next
      // fadeOut() call on it a no-op and lets the raw bind pose leak
      // through mid-crossfade. clampWhenFinished=true pauses instead,
      // staying enabled so the crossfade back to idle actually works.
      shootAction.clampWhenFinished = true;
      armsMixer.addEventListener("finished", (event) => {
        if (event.action === shootAction && idleAction) {
          idleAction.reset().play();
          idleAction.crossFadeFrom(shootAction, 0.15, false);
        }
      });
    }
  }

  // Same camera-bone alignment as src/playerArms.js: if the rig has a
  // camera_01 bone, center it at this group's local origin and correct
  // for the rig's reversed forward convention.
  armsScene.updateMatrixWorld(true);
  const cameraBone = armsScene.getObjectByName("camera_01");
  if (cameraBone) {
    const camBoneWorld = cameraBone.getWorldPosition(new THREE.Vector3());
    armsScene.position.sub(camBoneWorld);
  } else {
    console.error(
      "flash_sandbox: no camera_01 bone found on player_arms.glb — " +
        "skipping the auto camera-alignment offset, matching " +
        "src/playerArms.js's fallback"
    );
  }
  const wrapper = new THREE.Group();
  wrapper.add(armsScene);
  wrapper.rotation.y = Math.PI;
  wrapper.position.sub(GUN_CENTER_OFFSET);
  root.add(wrapper);

  const CROSSHAIR_NAME_PATTERN = /crosshair|reticle/i;
  armsScene.traverse((obj) => {
    if (obj.isMesh || obj.isSkinnedMesh) {
      obj.frustumCulled = false;
      if (CROSSHAIR_NAME_PATTERN.test(obj.name)) obj.visible = false;
    }
  });
});

// --- Sliders + output --------------------------------------------------
const outputEl = document.getElementById("output");
function applyState() {
  flashAnchor.position.set(state.x, state.y, state.z);
  outputEl.textContent = `const MUZZLE_FLASH_OFFSET = new THREE.Vector3(${state.x.toFixed(3)}, ${state.y.toFixed(3)}, ${state.z.toFixed(3)});`;
}

for (const axis of ["x", "y", "z"]) {
  const slider = document.getElementById(`slider-${axis}`);
  const valEl = document.getElementById(`val-${axis}`);
  slider.value = state[axis];
  valEl.textContent = state[axis].toFixed(3);
  slider.addEventListener("input", () => {
    state[axis] = parseFloat(slider.value);
    valEl.textContent = state[axis].toFixed(3);
    applyState();
  });
}
applyState();

// --- Resize + render loop ---------------------------------------------------
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (armsMixer) armsMixer.update(dt);

  if (flashSprite.visible && performance.now() >= flashHideAt) {
    flashSprite.visible = false;
  }
  // Smooth exponential decay toward 0 rather than a hard cutoff/timeout,
  // per the request - see MUZZLE_FLASH_LIGHT_DECAY_RATE above for the math.
  if (flashLight.intensity > 0) {
    flashLight.intensity *= Math.exp(-MUZZLE_FLASH_LIGHT_DECAY_RATE * dt);
    if (flashLight.intensity < 0.01) flashLight.intensity = 0;
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
